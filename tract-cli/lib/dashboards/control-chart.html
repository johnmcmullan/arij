<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Control Chart — Tract</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3/dist/chartjs-plugin-annotation.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <style>
    /* ── Catppuccin Mocha ── */
    :root {
      --bg:         #1e1e2e;
      --bg-alt:     #313244;
      --bg-surface: #181825;
      --fg:         #cdd6f4;
      --fg-dim:     #6c7086;
      --border:     #45475a;
      --cyan:       #89dceb;
      --blue:       #89b4fa;
      --yellow:     #f9e2af;
      --purple:     #cba6f7;
      --green:      #a6e3a1;
      --peach:      #fab387;
      --red:        #f38ba8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: 'JetBrains Mono', 'Fira Code', monospace, system-ui; font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Header ── */
    .header { background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 7px 16px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .header-title { color: var(--cyan); font-weight: bold; font-size: 14px; letter-spacing: 0.04em; }
    .sep { color: var(--border); }
    .header-meta { color: var(--fg-dim); font-size: 12px; }
    .header-controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    select { background: var(--bg-alt); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: 12px; font-family: inherit; cursor: pointer; }
    select:focus { outline: none; border-color: var(--blue); }

    /* ── Stats band ── */
    .stats-band { background: var(--bg-alt); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 32px; align-items: center; flex-shrink: 0; }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-label { color: var(--fg-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    .stat-value { font-size: 20px; font-weight: bold; }
    .stat-value.good    { color: var(--green); }
    .stat-value.warn    { color: var(--yellow); }
    .stat-value.bad     { color: var(--red); }
    .stat-value.neutral { color: var(--cyan); }
    .goal-bar-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .goal-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-dim); }
    .goal-bar-track { background: var(--bg-surface); border-radius: 4px; height: 8px; overflow: hidden; }
    .goal-bar-fill  { height: 100%; border-radius: 4px; background: var(--blue); transition: width 0.4s; }
    .goal-bar-fill.ahead  { background: var(--green); }
    .goal-bar-fill.behind { background: var(--yellow); }
    .goal-bar-fill.risk   { background: var(--red); }

    /* ── Charts area ── */
    .charts { flex: 1; display: grid; grid-template-rows: 1fr 1fr; gap: 0; overflow: hidden; }
    .chart-panel { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
    .chart-panel + .chart-panel { border-top: 1px solid var(--border); }
    .chart-title { color: var(--fg-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }
    .chart-wrap  { flex: 1; position: relative; min-height: 0; }

    /* ── Dot legend ── */
    .legend { display: flex; gap: 16px; align-items: center; flex-shrink: 0; font-size: 11px; color: var(--fg-dim); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }

    /* ── Status bar ── */
    .status-bar { background: var(--bg-surface); border-top: 1px solid var(--border); padding: 4px 16px; font-size: 11px; color: var(--fg-dim); display: flex; gap: 16px; flex-shrink: 0; }
    .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 4px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body x-data="app()" x-init="init()">

  <!-- Header -->
  <div class="header">
    <span class="header-title">◈ Control Chart</span>
    <span class="sep">│</span>
    <span class="header-meta" x-text="meta.workspace || '…'"></span>
    <div class="header-controls">
      <select x-model="assigneeFilter" @change="render()">
        <option value="">All assignees</option>
        <template x-for="a in assignees" :key="a">
          <option :value="a" x-text="a"></option>
        </template>
      </select>
      <select x-model="yearFilter" @change="render()">
        <template x-for="y in availableYears" :key="y">
          <option :value="y" x-text="y"></option>
        </template>
      </select>
    </div>
  </div>

  <!-- Stats band -->
  <div class="stats-band">
    <div class="stat">
      <span class="stat-label">Completed</span>
      <span class="stat-value neutral" x-text="stats.completed"></span>
    </div>
    <div class="stat">
      <span class="stat-label">Goal</span>
      <span class="stat-value neutral" x-text="GOAL"></span>
    </div>
    <div class="stat">
      <span class="stat-label">Avg Cycle Time</span>
      <span class="stat-value"
        :class="stats.avgDays <= 14 && stats.avgDays >= 7 ? 'good' : stats.avgDays < 7 ? 'warn' : 'bad'"
        x-text="stats.avgDays ? stats.avgDays.toFixed(1) + 'd' : '–'"></span>
    </div>
    <div class="stat">
      <span class="stat-label">Out of Control</span>
      <span class="stat-value" :class="stats.outOfControl === 0 ? 'good' : 'bad'" x-text="stats.outOfControl"></span>
    </div>
    <div class="stat">
      <span class="stat-label">Projected EOY</span>
      <span class="stat-value"
        :class="stats.projected >= GOAL ? 'good' : stats.projected >= GOAL * 0.85 ? 'warn' : 'bad'"
        x-text="stats.projected || '–'"></span>
    </div>
    <div class="goal-bar-wrap">
      <div class="goal-bar-label">
        <span x-text="`${stats.completed} of ${GOAL} cases`"></span>
        <span x-text="stats.paceLabel"></span>
      </div>
      <div class="goal-bar-track">
        <div class="goal-bar-fill"
          :class="stats.paceClass"
          :style="`width: ${Math.min(100, (stats.completed / GOAL) * 100)}%`"></div>
      </div>
      <div class="goal-bar-label">
        <span x-text="`Expected by now: ${stats.expectedByNow}`"></span>
        <span x-text="stats.weeksDone + ' weeks elapsed'"></span>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <div class="charts">
    <!-- Control chart: cycle time per case -->
    <div class="chart-panel">
      <div style="display:flex; align-items:center; gap:16px; flex-shrink:0;">
        <span class="chart-title">Cycle Time per Case (days)</span>
        <div class="legend">
          <span><span class="dot" style="background:var(--green)"></span>Within limits (7–14d)</span>
          <span><span class="dot" style="background:var(--red)"></span>Out of control</span>
          <span><span class="dot" style="background:var(--yellow)"></span>Fast (&lt;7d)</span>
          <span style="margin-left:8px; color:var(--fg-dim)">── UCL 14d &nbsp; ── Avg &nbsp; ── LCL 7d</span>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="cycleChart"></canvas>
      </div>
    </div>

    <!-- Burnup: cumulative completions vs target -->
    <div class="chart-panel">
      <span class="chart-title">Goal Burnup — Cumulative Cases vs Target Pace</span>
      <div class="chart-wrap">
        <canvas id="burnupChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <span><span class="live-dot"></span>Live</span>
    <span x-text="`${tickets.length} total tickets · ${stats.completed} done in ${yearFilter}`"></span>
    <span x-text="lastUpdated ? 'Updated ' + lastUpdated : ''"></span>
  </div>

<script>
// ── Configuration ──────────────────────────────────────────────────────────
const GOAL        = 225;   // Annual case completion target
const LCL_DAYS    = 7;     // Lower control limit (days)
const UCL_DAYS    = 14;    // Upper control limit (days)
const YEAR_START  = `${new Date().getFullYear()}-01-01`;

// ── Chart defaults ─────────────────────────────────────────────────────────
Chart.defaults.color          = '#6c7086';
Chart.defaults.borderColor    = '#45475a';
Chart.defaults.font.family    = "'JetBrains Mono', 'Fira Code', monospace";
Chart.defaults.font.size      = 11;

function app() {
  return {
    tickets:       [],
    meta:          {},
    assigneeFilter: '',
    yearFilter:    new Date().getFullYear().toString(),
    lastUpdated:   '',
    stats:         {},
    cycleChart:    null,
    burnupChart:   null,

    get assignees() {
      const s = new Set(this.tickets.map(t => t.assignee).filter(Boolean));
      return [...s].sort();
    },

    get availableYears() {
      const years = new Set();
      for (const t of this.tickets) {
        const d = t.updated || t.created;
        if (d) years.add(new Date(d).getFullYear().toString());
      }
      years.add(new Date().getFullYear().toString());
      return [...years].sort((a,b) => b - a);
    },

    // Tickets that are "done" with a close date in the selected year
    get doneCases() {
      const yr = parseInt(this.yearFilter);
      return this.tickets
        .filter(t => t.status === 'done')
        .map(t => {
          const closeDate = t.updated ? new Date(t.updated) : null;
          const openDate  = t.created  ? new Date(t.created)  : null;
          const cycleDays = (closeDate && openDate)
            ? Math.max(0, (closeDate - openDate) / 86400000)
            : null;
          return { ...t, closeDate, openDate, cycleDays };
        })
        .filter(t => {
          if (!t.closeDate) return false;
          if (t.closeDate.getFullYear() !== yr) return false;
          if (this.assigneeFilter && t.assignee !== this.assigneeFilter) return false;
          return true;
        })
        .sort((a, b) => a.closeDate - b.closeDate);
    },

    computeStats() {
      const cases = this.doneCases;
      const completed = cases.length;

      const withCycle = cases.filter(t => t.cycleDays !== null);
      const avgDays   = withCycle.length
        ? withCycle.reduce((s, t) => s + t.cycleDays, 0) / withCycle.length
        : null;
      const outOfControl = withCycle.filter(t => t.cycleDays < LCL_DAYS || t.cycleDays > UCL_DAYS).length;

      // Pace
      const now       = new Date();
      const yearStart = new Date(`${this.yearFilter}-01-01`);
      const yearEnd   = new Date(`${this.yearFilter}-12-31`);
      const totalMs   = yearEnd - yearStart;
      const elapsed   = Math.min(now - yearStart, totalMs);
      const weeksDone = Math.floor(elapsed / (7 * 86400000));
      const pctElapsed = elapsed / totalMs;
      const expectedByNow = Math.round(GOAL * pctElapsed);
      const projected = pctElapsed > 0 ? Math.round(completed / pctElapsed) : 0;

      const delta = completed - expectedByNow;
      const paceLabel = delta === 0 ? 'On pace'
        : delta > 0 ? `+${delta} ahead` : `${delta} behind`;
      const paceClass = delta >= 0 ? 'ahead' : delta >= -10 ? 'behind' : 'risk';

      this.stats = { completed, avgDays, outOfControl, projected, paceLabel, paceClass, expectedByNow, weeksDone };
    },

    render() {
      this.computeStats();
      this.renderCycleChart();
      this.renderBurnupChart();
    },

    renderCycleChart() {
      const cases = this.doneCases;
      const labels = cases.map(t => t.closeDate.toLocaleDateString(undefined, { month:'short', day:'numeric' }));

      const pointColors = cases.map(t => {
        if (t.cycleDays === null) return 'rgba(108,112,134,0.6)';
        if (t.cycleDays < LCL_DAYS) return '#f9e2af';  // yellow: fast
        if (t.cycleDays > UCL_DAYS) return '#f38ba8';  // red: slow
        return '#a6e3a1';                                // green: good
      });

      const avgDays = this.stats.avgDays;

      const data = {
        labels,
        datasets: [{
          label: 'Cycle Time (days)',
          data: cases.map(t => t.cycleDays !== null ? parseFloat(t.cycleDays.toFixed(1)) : null),
          pointBackgroundColor: pointColors,
          pointBorderColor: pointColors,
          pointRadius: 5,
          pointHoverRadius: 7,
          borderColor: 'rgba(108,112,134,0.3)',
          borderWidth: 1,
          fill: false,
          tension: 0.3,
          spanGaps: false
        }]
      };

      const annotations = {
        ucl: {
          type: 'line', yMin: UCL_DAYS, yMax: UCL_DAYS,
          borderColor: 'rgba(243,139,168,0.7)', borderWidth: 1.5, borderDash: [6,3],
          label: { content: `UCL ${UCL_DAYS}d`, display: true, position: 'end',
                   backgroundColor: 'transparent', color: '#f38ba8', font: { size: 10 } }
        },
        lcl: {
          type: 'line', yMin: LCL_DAYS, yMax: LCL_DAYS,
          borderColor: 'rgba(249,226,175,0.7)', borderWidth: 1.5, borderDash: [6,3],
          label: { content: `LCL ${LCL_DAYS}d`, display: true, position: 'end',
                   backgroundColor: 'transparent', color: '#f9e2af', font: { size: 10 } }
        },
        ...(avgDays ? { avg: {
          type: 'line', yMin: avgDays, yMax: avgDays,
          borderColor: 'rgba(137,220,235,0.6)', borderWidth: 1, borderDash: [3,3],
          label: { content: `Avg ${avgDays.toFixed(1)}d`, display: true, position: 'start',
                   backgroundColor: 'transparent', color: '#89dceb', font: { size: 10 } }
        }} : {})
      };

      const opts = {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          annotation: { annotations },
          tooltip: {
            callbacks: {
              title: ctx => cases[ctx[0].dataIndex]?.id || '',
              label: ctx => {
                const t = cases[ctx.dataIndex];
                const lines = [`Title: ${t.title}`];
                if (t.cycleDays !== null) lines.push(`Cycle: ${t.cycleDays.toFixed(1)} days`);
                if (t.assignee) lines.push(`Assignee: ${t.assignee}`);
                return lines;
              }
            }
          }
        },
        scales: {
          x: { ticks: { maxRotation: 45, maxTicksLimit: 20 } },
          y: {
            title: { display: true, text: 'Days', color: '#6c7086' },
            min: 0,
            suggestedMax: Math.max(UCL_DAYS * 1.5, (this.stats.avgDays || UCL_DAYS) * 1.5)
          }
        }
      };

      if (this.cycleChart) {
        this.cycleChart.data = data;
        this.cycleChart.options.plugins.annotation.annotations = annotations;
        this.cycleChart.options.scales.y.suggestedMax = opts.scales.y.suggestedMax;
        this.cycleChart.update('none');
      } else {
        this.cycleChart = new Chart(document.getElementById('cycleChart'), { type: 'line', data, options: opts });
      }
    },

    renderBurnupChart() {
      const yr = parseInt(this.yearFilter);
      const yearStart = new Date(`${yr}-01-01`);
      const yearEnd   = new Date(`${yr}-12-31`);
      const now       = new Date();
      const isCurrentYear = yr === now.getFullYear();

      // Build weekly labels for full year
      const weeks = [];
      for (let d = new Date(yearStart); d <= yearEnd; d.setDate(d.getDate() + 7)) {
        weeks.push(new Date(d));
      }

      // Target pace line (linear)
      const targetData = weeks.map(w => {
        const pct = Math.min(1, (w - yearStart) / (yearEnd - yearStart));
        return parseFloat((GOAL * pct).toFixed(1));
      });

      // Cumulative actual completions
      const cases = this.doneCases;
      const actualData = weeks.map(weekEnd => {
        const count = cases.filter(t => t.closeDate <= weekEnd).length;
        return count;
      });

      // Trim future weeks for current year
      const cutoffIdx = isCurrentYear
        ? weeks.findIndex(w => w > now)
        : weeks.length;
      const trimmedActual = actualData.slice(0, cutoffIdx === -1 ? weeks.length : cutoffIdx);

      const labels = weeks.map(w => w.toLocaleDateString(undefined, { month:'short', day:'numeric' }));

      const data = {
        labels,
        datasets: [
          {
            label: `Target (${GOAL})`,
            data: targetData,
            borderColor: 'rgba(137,180,250,0.5)',
            borderWidth: 1.5,
            borderDash: [6, 3],
            pointRadius: 0,
            fill: false,
            tension: 0
          },
          {
            label: 'Completed',
            data: [...trimmedActual, ...Array(labels.length - trimmedActual.length).fill(null)],
            borderColor: '#a6e3a1',
            borderWidth: 2,
            backgroundColor: 'rgba(166,227,161,0.08)',
            pointRadius: 0,
            fill: true,
            tension: 0,
            stepped: true
          }
        ]
      };

      const opts = {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { labels: { color: '#6c7086', boxWidth: 12, padding: 16 } },
          tooltip: {
            callbacks: {
              label: ctx => {
                const label = ctx.dataset.label;
                const val   = ctx.parsed.y;
                if (label === 'Completed') {
                  const behind = targetData[ctx.dataIndex] - val;
                  return `Completed: ${val}  (${behind > 0 ? behind + ' behind pace' : Math.abs(behind) + ' ahead'})`;
                }
                return `${label}: ${val}`;
              }
            }
          }
        },
        scales: {
          x: { ticks: { maxRotation: 0, maxTicksLimit: 12 } },
          y: { min: 0, max: GOAL, title: { display: true, text: 'Cases', color: '#6c7086' } }
        }
      };

      if (this.burnupChart) {
        this.burnupChart.data = data;
        this.burnupChart.update('none');
      } else {
        this.burnupChart = new Chart(document.getElementById('burnupChart'), { type: 'line', data, options: opts });
      }
    },

    async load() {
      const [tickets, meta] = await Promise.all([
        fetch('/api/tickets').then(r => r.json()),
        fetch('/api/meta').then(r => r.json())
      ]);
      this.tickets = tickets;
      this.meta    = meta;
      this.lastUpdated = new Date().toLocaleTimeString();
      this.render();
    },

    async init() {
      await this.load();
      const es = new EventSource('/api/events');
      es.onmessage = () => this.load();
    }
  };
}
</script>
</body>
</html>
