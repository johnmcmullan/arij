<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scrum Board — Tract</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <style>
    /* Catppuccin Mocha */
    :root {
      --bg:         #1e1e2e;
      --bg-alt:     #313244;
      --bg-surface: #181825;
      --fg:         #cdd6f4;
      --fg-dim:     #6c7086;
      --border:     #45475a;
      --cyan:       #89dceb;
      --blue:       #89b4fa;
      --yellow:     #f9e2af;
      --purple:     #cba6f7;
      --green:      #a6e3a1;
      --peach:      #fab387;
      --red:        #f38ba8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: 'JetBrains Mono', 'Fira Code', monospace, system-ui; font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Header ── */
    .header { background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 7px 16px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .header-title { color: var(--cyan); font-weight: bold; font-size: 14px; letter-spacing: 0.04em; }
    .sep { color: var(--border); }
    .header-meta { color: var(--fg-dim); font-size: 12px; }
    .header-controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    select, input[type=search] { background: var(--bg-alt); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: 12px; font-family: inherit; }
    select { cursor: pointer; }
    input[type=search] { width: 160px; }
    input[type=search]::placeholder { color: var(--fg-dim); }
    select:focus, input[type=search]:focus { outline: none; border-color: var(--blue); }

    /* ── Sprint summary band ── */
    .sprint-band { background: var(--bg-alt); border-bottom: 1px solid var(--border); padding: 8px 16px; flex-shrink: 0; }
    .sprint-band-empty { color: var(--fg-dim); font-size: 12px; text-align: center; padding: 10px; }
    .sprint-row1 { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
    .sprint-name  { color: var(--cyan); font-weight: bold; font-size: 13px; }
    .sprint-state { font-size: 11px; padding: 1px 8px; border-radius: 99px; font-weight: bold; }
    .sprint-state.open   { background: rgba(166,227,161,0.15); color: var(--green); border: 1px solid var(--green); }
    .sprint-state.closed { background: rgba(108,112,134,0.15); color: var(--fg-dim); border: 1px solid var(--border); }
    .sprint-goal  { color: var(--fg-dim); font-size: 12px; font-style: italic; }
    .sprint-dates { color: var(--fg-dim); font-size: 11px; margin-left: auto; }
    .sprint-row2  { display: flex; align-items: center; gap: 14px; }
    .sprint-stat  { font-size: 11px; }
    .sprint-stat .n { font-weight: bold; }
    .prog-track { flex: 1; height: 6px; background: var(--bg-surface); border-radius: 3px; overflow: hidden; }
    .prog-fill  { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.5s; }
    .prog-pct   { color: var(--fg-dim); font-size: 11px; min-width: 36px; text-align: right; }

    /* ── Board ── */
    .board { flex: 1; overflow: auto; padding: 12px; }

    /* Single-project columns */
    .columns { display: flex; gap: 10px; height: 100%; align-items: flex-start; }
    .column { flex: 1; min-width: 200px; background: var(--bg-alt); border-radius: 8px; border-top: 2px solid var(--border); display: flex; flex-direction: column; max-height: 100%; }
    .column.col-todo        { border-top-color: var(--blue); }
    .column.col-in-progress { border-top-color: var(--yellow); }
    .column.col-review      { border-top-color: var(--purple); }
    .column.col-done        { border-top-color: var(--green); }
    .column-header { padding: 8px 12px; font-weight: bold; font-size: 12px; letter-spacing: 0.06em; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .column.col-todo        .column-header { color: var(--blue); }
    .column.col-in-progress .column-header { color: var(--yellow); }
    .column.col-review      .column-header { color: var(--purple); }
    .column.col-done        .column-header { color: var(--green); }
    .col-count { background: var(--bg-surface); color: var(--fg-dim); padding: 1px 7px; border-radius: 99px; font-size: 11px; }
    .column-cards { padding: 6px 8px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .col-empty { padding: 20px; text-align: center; color: var(--fg-dim); }

    /* Multi-project swimlanes */
    .swimlanes { display: flex; flex-direction: column; gap: 8px; }
    .sl-header-row { display: flex; gap: 8px; padding-left: 130px; }
    .sl-col-hdr { flex: 1; font-weight: bold; font-size: 12px; letter-spacing: 0.06em; padding: 6px 10px; background: var(--bg-alt); border-radius: 6px; border: 1px solid var(--border); text-align: center; }
    .sl-col-hdr.col-todo        { color: var(--blue); }
    .sl-col-hdr.col-in-progress { color: var(--yellow); }
    .sl-col-hdr.col-review      { color: var(--purple); }
    .sl-col-hdr.col-done        { color: var(--green); }
    .sl-row { display: flex; gap: 8px; }
    .sl-label { width: 122px; flex-shrink: 0; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; justify-content: center; }
    .sl-label-name  { color: var(--purple); font-weight: bold; font-size: 13px; }
    .sl-label-count { color: var(--fg-dim); font-size: 11px; margin-top: 3px; }
    .sl-cell { flex: 1; min-height: 70px; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; max-height: 260px; }

    /* Cards */
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; transition: border-color 0.12s; }
    .card:hover { border-color: var(--blue); }
    .card.is-blocked { border-left: 3px solid var(--red); padding-left: 8px; }
    .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .type-icon  { color: var(--fg-dim); font-size: 11px; flex-shrink: 0; }
    .ticket-id  { color: var(--cyan); font-weight: bold; font-size: 11px; }
    .ticket-est { color: var(--purple); font-size: 11px; margin-left: auto; white-space: nowrap; }
    .ticket-title { color: var(--fg); font-size: 12px; line-height: 1.35; margin-bottom: 5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .pri  { font-size: 10px; }
    .who  { color: var(--blue); font-size: 11px; }
    .lbl  { color: var(--cyan); font-size: 10px; background: rgba(137,220,235,0.1); border-radius: 3px; padding: 1px 5px; }
    .blocked-tag { color: var(--red); font-size: 10px; }
    .card-prog { margin-top: 5px; display: flex; align-items: center; gap: 6px; }
    .card-prog .prog-track { flex: 1; height: 4px; background: var(--bg-alt); border-radius: 2px; overflow: hidden; }
    .card-prog .prog-fill  { height: 100%; border-radius: 2px; transition: width 0.3s; }
    .card-prog .prog-pct   { color: var(--fg-dim); font-size: 10px; min-width: 28px; text-align: right; }

    /* Status bar */
    .statusbar { background: var(--bg-surface); border-top: 1px solid var(--border); padding: 5px 16px; display: flex; gap: 14px; align-items: center; color: var(--fg-dim); font-size: 11px; flex-shrink: 0; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .stat-done   { color: var(--green); }
    .stat-active { color: var(--yellow); }
    .stat-block  { color: var(--red); }

    /* ── Detail panel ── */
    .detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; justify-content: flex-end; }
    .detail-panel { width: 520px; max-width: 92vw; height: 100vh; background: var(--bg-surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; animation: slideIn 0.18s ease-out; }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .dp-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .dp-id { color: var(--cyan); font-weight: bold; font-size: 13px; }
    .dp-project { color: var(--fg-dim); font-size: 11px; }
    .dp-close { margin-left: auto; background: none; border: none; color: var(--fg-dim); font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 4px; line-height: 1; }
    .dp-close:hover { background: var(--bg-alt); color: var(--fg); }
    .dp-body { flex: 1; overflow-y: auto; padding: 16px; }
    .dp-title { color: var(--fg); font-size: 15px; font-weight: bold; line-height: 1.4; margin-bottom: 14px; }
    .dp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .dp-chip { font-size: 11px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--border); }
    .dp-chip.type   { color: var(--purple); border-color: var(--purple); background: rgba(203,166,247,0.08); }
    .dp-chip.status-todo        { color: var(--blue);   border-color: var(--blue);   background: rgba(137,180,250,0.08); }
    .dp-chip.status-in-progress { color: var(--yellow); border-color: var(--yellow); background: rgba(249,226,175,0.08); }
    .dp-chip.status-review      { color: var(--purple); border-color: var(--purple); background: rgba(203,166,247,0.08); }
    .dp-chip.status-done        { color: var(--green);  border-color: var(--green);  background: rgba(166,227,161,0.08); }
    .dp-chip.status-backlog     { color: var(--fg-dim); border-color: var(--border); }
    .dp-chip.pri-blocker,.dp-chip.pri-critical { color: var(--red);    border-color: var(--red);    background: rgba(243,139,168,0.08); }
    .dp-chip.pri-major          { color: var(--peach);  border-color: var(--peach);  background: rgba(250,179,135,0.08); }
    .dp-chip.pri-minor          { color: var(--yellow); border-color: var(--yellow); background: rgba(249,226,175,0.08); }
    .dp-chip.pri-trivial        { color: var(--fg-dim); border-color: var(--border); }
    .dp-fields { display: grid; grid-template-columns: 100px 1fr; gap: 6px 10px; margin-bottom: 16px; font-size: 12px; }
    .dp-label { color: var(--fg-dim); }
    .dp-value { color: var(--fg); }
    .dp-value.assignee { color: var(--blue); }
    .dp-value.sprint   { color: var(--cyan); }
    .dp-value.blocked  { color: var(--red);  }
    .dp-divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .md-body { font-size: 12px; line-height: 1.65; color: var(--fg); }
    .md-body h1,.md-body h2,.md-body h3 { color: var(--cyan); margin: 16px 0 6px; font-size: 13px; }
    .md-body h1 { font-size: 14px; }
    .md-body h2 { border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .md-body p  { margin: 6px 0; }
    .md-body ul,.md-body ol { margin: 6px 0 6px 18px; }
    .md-body li { margin: 3px 0; }
    .md-body li input[type=checkbox] { accent-color: var(--green); margin-right: 5px; cursor: default; }
    .md-body code { background: var(--bg-alt); color: var(--peach); padding: 1px 5px; border-radius: 3px; font-family: inherit; font-size: 11px; }
    .md-body pre  { background: var(--bg-alt); padding: 10px 12px; border-radius: 6px; margin: 8px 0; overflow-x: auto; }
    .md-body pre code { background: none; color: var(--fg); padding: 0; }
    .md-body strong { color: var(--fg); font-weight: bold; }
    .md-body em { color: var(--fg-dim); }
    .md-body blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 4px 12px; color: var(--fg-dim); }
    .dp-empty { color: var(--fg-dim); font-style: italic; font-size: 12px; }
    .dp-prog { display: flex; align-items: center; gap: 8px; }
    .dp-prog-track { flex: 1; height: 5px; background: var(--bg-alt); border-radius: 3px; overflow: hidden; }
    .dp-prog-fill  { height: 100%; border-radius: 3px; }

    /* No-sprint placeholder */
    .no-sprint { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--fg-dim); }
    .no-sprint-icon { font-size: 32px; }
  </style>
</head>
<body x-data="scrum()" x-init="init()" @keydown.escape.window="closeTicket()">

  <!-- Header -->
  <div class="header">
    <span class="header-title">▐ <span x-text="pageTitle"></span></span>
    <span class="sep">│</span>
    <span class="header-meta" x-text="filteredTickets.length + ' tickets'"></span>
    <template x-if="projects.length > 1">
      <><span class="sep">│</span>
      <span class="header-meta" x-text="projects.length + ' projects'"></span></>
    </template>
    <div class="header-controls">
      <input type="search" placeholder="Search…" x-model.debounce="search">
      <select x-model="assigneeFilter" @change="applyFilters()">
        <option value="">All assignees</option>
        <template x-for="a in assignees" :key="a">
          <option :value="a" x-text="a"></option>
        </template>
      </select>
      <select x-model="selectedSprintId" @change="applyFilters()">
        <option value="">— select sprint —</option>
        <template x-for="s in sprints" :key="s.id">
          <option :value="s.id" x-text="(s.name || s.id) + (s.state==='open' ? ' ●' : '')"></option>
        </template>
      </select>
    </div>
  </div>

  <!-- Sprint summary band -->
  <div class="sprint-band">
    <template x-if="currentSprint">
      <div>
        <div class="sprint-row1">
          <span class="sprint-name" x-text="currentSprint.name || currentSprint.id"></span>
          <span class="sprint-state" :class="currentSprint.state" x-text="currentSprint.state?.toUpperCase()"></span>
          <span class="sprint-goal" x-show="currentSprint.goal" x-text="currentSprint.goal"></span>
          <span class="sprint-dates" x-text="formatDates(currentSprint)"></span>
        </div>
        <div class="sprint-row2">
          <span class="sprint-stat">Done: <span class="n stat-done" x-text="done"></span></span>
          <span class="sprint-stat">Active: <span class="n stat-active" x-text="active"></span></span>
          <span class="sprint-stat" x-show="blocked > 0">Blocked: <span class="n stat-block" x-text="blocked"></span></span>
          <span class="sprint-stat">Total: <span class="n" x-text="filteredTickets.length"></span></span>
          <div class="prog-track">
            <div class="prog-fill" :style="'width:' + completionPct + '%'"></div>
          </div>
          <span class="prog-pct" x-text="completionPct + '% done'"></span>
        </div>
      </div>
    </template>
    <div class="sprint-band-empty" x-show="!currentSprint">
      No sprint selected — choose one above, or ask Claude to start one with <code>tract-sprints</code>
    </div>
  </div>

  <!-- Board -->
  <div class="board">

    <div class="no-sprint" x-show="!currentSprint">
      <div class="no-sprint-icon">◷</div>
      <div>Select a sprint to see the board</div>
    </div>

    <!-- Single-project: columns -->
    <template x-if="currentSprint && projects.length <= 1">
      <div class="columns">
        <template x-for="col in columns" :key="col.status">
          <div class="column" :class="'col-' + col.status">
            <div class="column-header">
              <span x-text="col.label"></span>
              <span class="col-count" x-text="colTickets(col.status).length"></span>
            </div>
            <div class="column-cards">
              <template x-for="t in colTickets(col.status)" :key="t.id">
                <div x-html="cardHtml(t)" :class="'card' + (t.blocked_by ? ' is-blocked' : '')" @click="openTicket(t)" style="cursor:pointer"></div>
              </template>
              <div class="col-empty" x-show="colTickets(col.status).length === 0">·</div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- Multi-project: swimlane grid -->
    <template x-if="currentSprint && projects.length > 1">
      <div class="swimlanes">
        <div class="sl-header-row">
          <template x-for="col in columns" :key="col.status">
            <div class="sl-col-hdr" :class="'col-' + col.status" x-text="col.label"></div>
          </template>
        </div>
        <template x-for="proj in activeProjects" :key="proj.prefix">
          <div class="sl-row">
            <div class="sl-label">
              <div class="sl-label-name"  x-text="proj.prefix"></div>
              <div class="sl-label-count" x-text="projTickets(proj.prefix).length + ' tickets'"></div>
            </div>
            <template x-for="col in columns" :key="col.status">
              <div class="sl-cell">
                <template x-for="t in cellTickets(proj.prefix, col.status)" :key="t.id">
                  <div x-html="cardHtml(t)" :class="'card' + (t.blocked_by ? ' is-blocked' : '')" @click="openTicket(t)" style="cursor:pointer"></div>
                </template>
                <div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--fg-dim)"
                     x-show="cellTickets(proj.prefix, col.status).length === 0">·</div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

  </div>

  <!-- Status bar -->
  <div class="statusbar">
    <div style="display:flex;align-items:center;gap:5px"><div class="live-dot"></div> Live</div>
    <span class="sep" style="color:var(--border)">│</span>
    <span x-text="completionPct + '% complete'"></span>
    <span class="sep" style="color:var(--border)">│</span>
    Done: <span class="stat-done" x-text="done + '/' + filteredTickets.length"></span>
    <template x-if="blocked > 0">
      <><span class="sep" style="color:var(--border)">│</span>
      Blocked: <span class="stat-block" x-text="blocked"></span></>
    </template>
    <template x-if="currentSprint?.start">
      <><span class="sep" style="color:var(--border)">│</span>
      <span x-text="daysLeft()"></span></>
    </template>
  </div>

  <!-- Ticket detail panel -->
  <div class="detail-overlay" x-show="selectedTicket" @click.self="closeTicket()" style="display:none">
    <div class="detail-panel">
      <div class="dp-header">
        <span class="dp-id" x-text="selectedTicket?.id"></span>
        <span class="dp-project" x-text="selectedTicket?.project ? '· ' + selectedTicket.project : ''"></span>
        <button class="dp-close" @click="closeTicket()">✕</button>
      </div>
      <div class="dp-body" x-show="selectedTicket">
        <div class="dp-title" x-text="selectedTicket?.title"></div>
        <div class="dp-chips">
          <span class="dp-chip type"  x-text="selectedTicket?.type"></span>
          <span class="dp-chip"      :class="'status-' + (selectedTicket?.status||'').replace(/\s+/g,'-')"
                                      x-text="selectedTicket?.status"></span>
          <span class="dp-chip"      :class="'pri-' + selectedTicket?.priority"
                                      x-text="selectedTicket?.priority"></span>
        </div>
        <div class="dp-fields">
          <template x-if="selectedTicket?.assignee">
            <><span class="dp-label">Assignee</span><span class="dp-value assignee" x-text="selectedTicket.assignee"></span></>
          </template>
          <template x-if="selectedTicket?.sprint">
            <><span class="dp-label">Sprint</span><span class="dp-value sprint" x-text="selectedTicket.sprint"></span></>
          </template>
          <template x-if="selectedTicket?.estimate">
            <><span class="dp-label">Estimate</span><span class="dp-value" x-text="selectedTicket.estimate"></span></>
          </template>
          <template x-if="selectedTicket?.labels?.length">
            <><span class="dp-label">Labels</span>
            <span class="dp-value" x-text="selectedTicket.labels.map(l => '#' + l).join('  ')"></span></>
          </template>
          <template x-if="selectedTicket?.blocked_by">
            <><span class="dp-label">Blocked by</span><span class="dp-value blocked" x-text="selectedTicket.blocked_by"></span></>
          </template>
          <template x-if="selectedTicket?.created">
            <><span class="dp-label">Created</span>
            <span class="dp-value" x-text="new Date(selectedTicket.created).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})"></span></>
          </template>
          <template x-if="selectedTicket?.estimateSeconds > 0">
            <><span class="dp-label">Progress</span>
            <div class="dp-value dp-prog">
              <div class="dp-prog-track">
                <div class="dp-prog-fill" :style="`width:${Math.min(100,Math.round((selectedTicket.loggedSeconds||0)/selectedTicket.estimateSeconds*100))}%;background:${Math.round((selectedTicket.loggedSeconds||0)/selectedTicket.estimateSeconds*100)>=80?'#a6e3a1':'#f9e2af'}`"></div>
              </div>
              <span x-text="Math.min(100,Math.round((selectedTicket.loggedSeconds||0)/selectedTicket.estimateSeconds*100))+'%'"></span>
            </div></>
          </template>
        </div>
        <hr class="dp-divider">
        <div class="md-body" x-show="ticketBody" x-html="renderBody(ticketBody)"></div>
        <div class="dp-empty" x-show="selectedTicket && ticketBody === null">Loading…</div>
        <div class="dp-empty" x-show="selectedTicket && ticketBody === ''">No description.</div>
      </div>
    </div>
  </div>

  <script>
  function scrum() {
    return {
      tickets: [], filteredTickets: [], sprints: [], projects: [], meta: {},
      selectedSprintId: '', search: '',
      selectedTicket: null, ticketBody: null,
      // URL param state
      projectParam: '', assigneeFilter: '', titleParam: '',
      columns: [
        { status: 'todo',        label: 'TODO'        },
        { status: 'in-progress', label: 'IN PROGRESS' },
        { status: 'review',      label: 'REVIEW'      },
        { status: 'done',        label: 'DONE'        }
      ],

      get pageTitle() {
        if (this.titleParam) return this.titleParam;
        return this.meta.workspace ? this.meta.workspace.toUpperCase() + ' SCRUM' : 'TRACT SCRUM';
      },
      get currentSprint() { return this.sprints.find(s => s.id === this.selectedSprintId) || null; },
      get done()    { return this.filteredTickets.filter(t => t.status === 'done').length; },
      get active()  { return this.filteredTickets.filter(t => t.status === 'in-progress').length; },
      get blocked() { return this.filteredTickets.filter(t => t.blocked_by).length; },
      get completionPct() {
        if (!this.filteredTickets.length) return 0;
        return Math.round(this.done / this.filteredTickets.length * 100);
      },
      get activeProjects() {
        return this.projects.filter(p => this.projTickets(p.prefix).length > 0);
      },
      get assignees() {
        const s = new Set(this.tickets.map(t => t.assignee).filter(Boolean));
        return [...s].sort();
      },

      apiUrl(base) {
        const q = new URLSearchParams();
        if (this.projectParam) q.set('project', this.projectParam);
        return q.toString() ? `${base}?${q}` : base;
      },

      async init() {
        const p = new URLSearchParams(window.location.search);
        this.projectParam   = p.get('project')  || '';
        this.assigneeFilter = p.get('assignee') || '';
        this.titleParam     = p.get('title')    || '';
        if (p.get('sprint')) this.selectedSprintId = p.get('sprint');
        await this.load();
        this.$watch('search',         () => this.applyFilters());
        this.$watch('assigneeFilter', () => this.applyFilters());
        const es = new EventSource('/api/events');
        es.onmessage = () => this.load();
      },

      async load() {
        const [tickets, sprints, projects, meta] = await Promise.all([
          fetch(this.apiUrl('/api/tickets')).then(r => r.json()),
          fetch('/api/sprints').then(r => r.json()),
          fetch(this.apiUrl('/api/projects')).then(r => r.json()),
          fetch('/api/meta').then(r => r.json())
        ]);
        this.tickets  = tickets;
        this.sprints  = sprints.sort((a, b) => b.id.localeCompare(a.id));
        this.projects = projects;
        this.meta     = meta;
        // Default to open sprint, or most recent — but respect URL param
        if (!this.selectedSprintId) {
          const open = sprints.find(s => s.state === 'open');
          this.selectedSprintId = (open || sprints[0])?.id || '';
        }
        this.applyFilters();
      },

      applyFilters() {
        let r = [...this.tickets];
        if (this.selectedSprintId) {
          r = r.filter(t => t.sprint === this.selectedSprintId);
        }
        if (this.assigneeFilter) {
          r = r.filter(t => t.assignee === this.assigneeFilter);
        }
        if (this.search.trim()) {
          const q = this.search.toLowerCase();
          r = r.filter(t => t.id.toLowerCase().includes(q) || t.title.toLowerCase().includes(q));
        }
        this.filteredTickets = r;
      },

      async openTicket(t) {
        this.selectedTicket = t;
        this.ticketBody = null;
        try {
          const r = await fetch(`/api/ticket/${t.id}`);
          const data = await r.json();
          this.ticketBody = data.body || '';
        } catch(e) { console.error('openTicket failed:', e); this.ticketBody = ''; }
      },
      closeTicket() { this.selectedTicket = null; this.ticketBody = null; },
      renderBody(md) {
        if (!md) return '';
        return marked.parse(md, { breaks: true, gfm: true });
      },

      colTickets(status)          { return this.filteredTickets.filter(t => t.status === status); },
      projTickets(prefix)         { return this.filteredTickets.filter(t => t.project === prefix); },
      cellTickets(prefix, status) { return this.filteredTickets.filter(t => t.project === prefix && t.status === status); },

      formatDates(sprint) {
        if (!sprint?.start) return '';
        const fmt = d => new Date(d).toLocaleDateString(undefined, { month:'short', day:'numeric' });
        return sprint.end ? fmt(sprint.start) + ' – ' + fmt(sprint.end) : fmt(sprint.start);
      },

      daysLeft() {
        if (!this.currentSprint?.end) return '';
        const end = new Date(this.currentSprint.end);
        const today = new Date(); today.setHours(0,0,0,0); end.setHours(0,0,0,0);
        const days = Math.ceil((end - today) / 86400000);
        if (days < 0)  return Math.abs(days) + 'd overdue';
        if (days === 0) return 'ends today';
        return days + 'd remaining';
      },

      cardHtml(t) {
        const typeIcons = { epic:'◆', story:'●', task:'○', bug:'✕' };
        const priSyms   = { blocker:'▰▰▰', critical:'▰▰▱', major:'▰▱▱', minor:'▱▱▱', trivial:'···' };
        const priColors = { blocker:'#f38ba8', critical:'#f38ba8', major:'#fab387', minor:'#f9e2af', trivial:'#6c7086' };
        const icon = typeIcons[(t.type||'task').toLowerCase()] || '○';
        const pri  = (t.priority||'medium').toLowerCase();
        const name = t.assignee ? t.assignee.split(/[.@]/)[0] : null;
        const labels = (t.labels||[]).slice(0,2).map(l => `<span class="lbl">#${this.esc(l)}</span>`).join('');
        const est   = t.estimate ? `<span class="ticket-est">◷ ${this.esc(t.estimate)}</span>` : '';
        const who   = name ? `<span class="who">@${this.esc(name)}</span>` : '';
        const blk   = t.blocked_by ? `<span class="blocked-tag">⊗ ${this.esc(t.blocked_by)}</span>` : '';
        let prog = '';
        if (t.estimateSeconds > 0) {
          const pct = Math.min(100, Math.round((t.loggedSeconds||0) / t.estimateSeconds * 100));
          const col = pct>=80?'#a6e3a1':pct>=50?'#f9e2af':pct>=25?'#fab387':'#6c7086';
          prog = `<div class="card-prog"><div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${col}"></div></div><span class="prog-pct">${pct}%</span></div>`;
        }
        return `<div class="card-top">
          <span class="type-icon">${icon}</span>
          <span class="ticket-id">${this.esc(t.id)}</span>${est}
        </div>
        <div class="ticket-title">${this.esc(t.title)}</div>
        <div class="card-meta">
          <span class="pri" style="color:${priColors[pri]||'#f9e2af'}">${priSyms[pri]||'▱▱▱'}</span>
          ${who}${labels}${blk}
        </div>${prog}`;
      },

      esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    };
  }
  </script>
</body>
</html>
